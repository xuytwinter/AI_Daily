name: Daily AI News

on:
  schedule:
    # 06:00 UTC == 14:00 Asia/Shanghai (Beijing). GitHub may delay 5-15+ min.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"
      force:
        description: "Re-fetch existing entries"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch daily news
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/fetch_daily.py --days "$DAYS" --force
          else
            python scripts/fetch_daily.py --days "$DAYS"
          fi

      - name: Update README index
        run: python scripts/update_readme.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily README.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          STAMP=$(date -u -d '+8 hours' +'%Y-%m-%d')
          git commit -m "chore(daily): ${STAMP} [skip ci]"
          git push
